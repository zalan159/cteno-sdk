name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Pack and import from a clean consumer
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/cteno-sdk-*.tgz
          node --input-type=module -e "
            const pkg = (await import('@cteno/sdk/package.json', { with: { type: 'json' } })).default;
            for (const key of Object.keys(pkg.exports)) {
              if (key.endsWith('.json')) continue;
              await import(key === '.' ? pkg.name : pkg.name + key.slice(1));
            }
            console.log('all exports load');"

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build && python -m build

  pack:
    name: Platform packaging (fake payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack every target from a stand-in payload and inspect the result
        run: |
          set -e
          P="$RUNNER_TEMP/payload"
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            rm -rf "$P" && mkdir -p "$P/bin" "$P/tools" "$P/skills" "$P/agents"
            exe=""; [ "$t" = win32-x64 ] && exe=.exe
            printf 'stand-in' > "$P/bin/cteno-host-cli$exe"
            printf "stand-in license\n" > "$P/LICENSE.daemon"
            printf '{"schemaVersion":1,"sku":"sdk-core","version":"0.0.0-ci","target":"%s","binaries":["cteno-host-cli%s"]}\n' "$t" "$exe" > "$P/manifest.json"
            node scripts/pack-platform.mjs --payload "$P" --target "$t" --out "$RUNNER_TEMP/out" --wheel
            node -e "const p=require('$RUNNER_TEMP/out/npm/sdk-$t/package.json'); if (!p.os.length || !p.cpu.length || p.cteno.daemonVersion!=='0.0.0-ci') process.exit(1)"
            (cd "$RUNNER_TEMP/out/npm/sdk-$t" && npm pack --dry-run 2>&1 | grep -q "bin/cteno-host-cli$exe")
          done
          python3 - "$RUNNER_TEMP/out/wheel" <<'PY'
          import sys, zipfile, pathlib
          wheels = sorted(pathlib.Path(sys.argv[1]).glob('*.whl'))
          assert len(wheels) == 5, wheels
          for w in wheels:
              names = zipfile.ZipFile(w).namelist()
              assert any(n.startswith('cteno_sdk/_bin/bin/cteno-host-cli') for n in names), w
              assert 'cteno_sdk/client.py' in names and any(n.endswith('.dist-info/RECORD') for n in names), w
          print('wheels ok:', [w.name for w in wheels])
          PY
          cp js/package.json "$RUNNER_TEMP/pkg.json" && node scripts/pin-platform-deps.mjs "$RUNNER_TEMP/pkg.json"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact -v .
