[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cteno-sdk"
version = "0.1.0"
description = "Python client for a locally running Cteno daemon (same owner-socket protocol as @cteno/sdk)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cteno contributors" }]
keywords = ["cteno", "agent", "sdk", "llm", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zalan159/cteno-sdk"
Source = "https://github.com/zalan159/cteno-sdk/tree/main/python"
Issues = "https://github.com/zalan159/cteno-sdk/issues"
Changelog = "https://github.com/zalan159/cteno-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["cteno_sdk"]
